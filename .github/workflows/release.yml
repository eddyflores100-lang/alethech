name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build sigstore

      - name: Build package
        run: python -m build

      - name: Sign with Sigstore (OIDC)
        # Sign each artifact. Modern sigstore (>=3.0) emits a .sigstore.json
        # bundle per file. We do NOT copy these into dist/ — they go to
        # a separate signatures/ dir so gh-action-pypi-publish doesn't
        # try to upload them as packages (which would fail with
        # InvalidDistribution: Unknown distribution format).
        run: |
          mkdir -p signatures
          for f in dist/*.whl dist/*.tar.gz; do
            sigstore sign "$f"
          done
          # Move all signature artifacts out of dist/ so PyPI upload is clean
          mv dist/*.sigstore.json signatures/ 2>/dev/null || true
          mv dist/*.sig dist/*.pem dist/*.crt signatures/ 2>/dev/null || true
          ls -la dist/
          echo "---"
          ls -la signatures/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # No inputs needed — defaults to packages-dir=dist which now contains
        # ONLY .whl and .tar.gz (signature files moved to signatures/ above).

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            signatures/*
