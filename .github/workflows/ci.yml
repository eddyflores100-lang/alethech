name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — only read access to repo content.
# Scorecard: Token-Permissions — explicit least-privilege.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    permissions:
      contents: read

    steps:
      # Pinned to commit SHA per Scorecard Pinned-Dependencies recommendation.
      # actions/checkout@v4.2.2 → 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # actions/setup-python@v5.4.0 → 42375524e23c412d93fb67b49958b491fce71c38
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Verify CLI works end-to-end
        run: |
          alethech --help
          alethech --store /tmp/alethech-ci-test init
          echo '{"test": true}' > /tmp/alethech-ci-content.json
          alethech --store /tmp/alethech-ci-test commit --content /tmp/alethech-ci-content.json
          alethech --store /tmp/alethech-ci-test verify


  cross-language:
    name: cross-language conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Python package
        run: pip install -e .

      - name: Build Rust helpers
        run: cargo build --manifest-path alethech-rs/Cargo.toml --release --bin alethech-conf --bin alethech-container

      - name: Run all three implementations
        run: python conformance/cross_language_check.py

      - name: Generate Python portable container
        run: |
          python - <<'PY'
          import json
          from alethech import Alethech
          from alethech.container import inspect_container
          a = Alethech.initialize("/tmp/aleth-source")
          a.commit({"interop": "python-to-typescript-rust"})
          a.seal("/tmp/interop.aleth", "interop-passphrase")
          with open("/tmp/py-payload.json", "w") as f:
              json.dump(inspect_container("/tmp/interop.aleth", "interop-passphrase"), f, sort_keys=True)
          PY

      - name: Open Python container in TypeScript
        run: |
          npx --yes tsx alethech-ts/aleth-container.ts open /tmp/interop.aleth interop-passphrase > /tmp/ts-payload.json

      - name: Open Python container in Rust
        run: |
          ./alethech-rs/target/release/alethech-container open /tmp/interop.aleth interop-passphrase > /tmp/rs-payload.json

      - name: Compare decrypted payload across Python, TypeScript, and Rust
        run: |
          python - <<'PY'
          import json
          py=json.load(open("/tmp/py-payload.json"))
          ts=json.load(open("/tmp/ts-payload.json"))
          rs=json.load(open("/tmp/rs-payload.json"))
          assert py == ts == rs, (py, ts, rs)
          assert py["payload_version"] == 1
          assert "HEAD" in py["files"]
          assert "keys/signing.key" in py["files"]
          assert "keys/root.key" not in py["files"]
          assert "keys/recovery.key" not in py["files"]
          assert len([x for x in py["files"] if x.startswith("commits/")]) == 2
          PY


      - name: Seal store in TypeScript and open in Python
        run: |
          npx --yes tsx alethech-ts/aleth-container.ts seal /tmp/aleth-source /tmp/ts-produced.aleth interop-passphrase
          python - <<'PY'
          from alethech import Alethech
          source = Alethech.open("/tmp/aleth-source")
          restored = Alethech.open_aleth("/tmp/ts-produced.aleth", "/tmp/from-ts", "interop-passphrase")
          assert restored.head == source.head
          assert restored.verify().ok
          assert not (restored.path / "keys" / "root.key").exists()
          assert not (restored.path / "keys" / "recovery.key").exists()
          assert (restored.path / "keys" / "signing.key").exists()
          PY


      - name: Seal store in Rust and open in Python
        run: |
          ./alethech-rs/target/release/alethech-container seal /tmp/aleth-source /tmp/rs-produced.aleth interop-passphrase
          python - <<'PY'
          from alethech import Alethech
          source = Alethech.open("/tmp/aleth-source")
          restored = Alethech.open_aleth("/tmp/rs-produced.aleth", "/tmp/from-rust", "interop-passphrase")
          assert restored.head == source.head
          assert restored.verify().ok
          assert not (restored.path / "keys" / "root.key").exists()
          assert not (restored.path / "keys" / "recovery.key").exists()
          assert (restored.path / "keys" / "signing.key").exists()
          PY
