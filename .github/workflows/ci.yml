name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Verify CLI works end-to-end
        run: |
          alethech --help
          alethech init --store /tmp/alethech-ci-test
          echo '{"test": true}' > /tmp/alethech-ci-content.json
          alethech commit --store /tmp/alethech-ci-test --content /tmp/alethech-ci-content.json
          alethech verify --store /tmp/alethech-ci-test
