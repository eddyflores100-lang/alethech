name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — only read access to repo content.
# Scorecard: Token-Permissions — explicit least-privilege.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    permissions:
      contents: read

    steps:
      # Pinned to commit SHA per Scorecard Pinned-Dependencies recommendation.
      # actions/checkout@v4.2.2 → 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # actions/setup-python@v5.4.0 → 42375524e23c412d93fb67b49958b491fce71c38
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Verify CLI works end-to-end
        run: |
          alethech --help
          alethech --store /tmp/alethech-ci-test init
          echo '{"test": true}' > /tmp/alethech-ci-content.json
          alethech --store /tmp/alethech-ci-test commit --content /tmp/alethech-ci-content.json
          alethech --store /tmp/alethech-ci-test verify


  cross-language:
    name: cross-language conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Python package
        run: pip install -e .

      - name: Build Rust helpers
        run: cargo build --locked --manifest-path alethech-rs/Cargo.toml --release --bin alethech-conf --bin alethech-container

      - name: Run Rust SDK tests
        run: cargo test --locked --manifest-path alethech-rs/Cargo.toml

      - name: Run TypeScript SDK tests
        run: npx --yes tsx alethech-ts/test.ts

      - name: Run browser WASM crypto tests
        run: cargo test --manifest-path alethech-wasm/Cargo.toml

      - name: Build browser WASM decryptor
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --manifest-path alethech-wasm/Cargo.toml --target wasm32-unknown-unknown --release

      - name: Run all three implementations
        run: python conformance/cross_language_check.py

      - name: Generate Python portable container
        run: |
          python - <<'PY'
          import json
          from alethech import Alethech
          from alethech.container import inspect_container
          a = Alethech.initialize("/tmp/aleth-source")
          ev = a.evidence(
              tool="interop.demo",
              input_bytes=b"request",
              output_bytes=b"response",
              artifacts={"proof.bin": b"portable-proof"},
          )
          a.commit(
              {"interop": "python-to-typescript-rust"},
              evidence_refs=[ev.commit_id],
          )
          a.seal("/tmp/interop.aleth", "interop-passphrase")
          with open("/tmp/py-payload.json", "w") as f:
              json.dump(inspect_container("/tmp/interop.aleth", "interop-passphrase"), f, sort_keys=True)
          PY

      - name: Open Python container in TypeScript
        run: |
          npx --yes tsx alethech-ts/aleth-container.ts open /tmp/interop.aleth interop-passphrase > /tmp/ts-payload.json

      - name: Open Python container in Rust
        run: |
          ./alethech-rs/target/release/alethech-container open /tmp/interop.aleth interop-passphrase > /tmp/rs-payload.json

      - name: Reject corrupted portable containers across runtimes
        run: |
          set -e
          if npx --yes tsx alethech-ts/aleth-container.ts open /tmp/interop.aleth wrong-passphrase >/dev/null 2>&1; then
            echo "TypeScript accepted wrong passphrase"; exit 1
          fi
          if ./alethech-rs/target/release/alethech-container open /tmp/interop.aleth wrong-passphrase >/dev/null 2>&1; then
            echo "Rust accepted wrong passphrase"; exit 1
          fi

          cp /tmp/interop.aleth /tmp/tampered.aleth
          python - <<'PY'
          p="/tmp/tampered.aleth"
          b=bytearray(open(p,"rb").read())
          b[-1] ^= 1
          open(p,"wb").write(b)
          PY
          if npx --yes tsx alethech-ts/aleth-container.ts open /tmp/tampered.aleth interop-passphrase >/dev/null 2>&1; then
            echo "TypeScript accepted tampered ciphertext"; exit 1
          fi
          if ./alethech-rs/target/release/alethech-container open /tmp/tampered.aleth interop-passphrase >/dev/null 2>&1; then
            echo "Rust accepted tampered ciphertext"; exit 1
          fi

          python - <<'PY'
          src=open("/tmp/interop.aleth","rb").read()
          open("/tmp/truncated.aleth","wb").write(src[:-12])
          PY
          if npx --yes tsx alethech-ts/aleth-container.ts open /tmp/truncated.aleth interop-passphrase >/dev/null 2>&1; then
            echo "TypeScript accepted truncated container"; exit 1
          fi
          if ./alethech-rs/target/release/alethech-container open /tmp/truncated.aleth interop-passphrase >/dev/null 2>&1; then
            echo "Rust accepted truncated container"; exit 1
          fi

      - name: Compare decrypted payload across Python, TypeScript, and Rust
        run: |
          python - <<'PY'
          import json
          py=json.load(open("/tmp/py-payload.json"))
          ts=json.load(open("/tmp/ts-payload.json"))
          rs=json.load(open("/tmp/rs-payload.json"))
          assert py == ts == rs, (py, ts, rs)
          assert py["payload_version"] == 1
          assert "HEAD" in py["files"]
          assert "keys/signing.key" in py["files"]
          assert "keys/root.key" not in py["files"]
          assert "keys/recovery.key" not in py["files"]
          assert len([x for x in py["files"] if x.startswith("commits/")]) == 2
          assert len([x for x in py["files"] if x.startswith("evidence/")]) == 1
          assert len([x for x in py["files"] if x.startswith("artifacts/")]) == 1
          PY


      - name: Verify dropped Python container with browser TypeScript verifier
        run: |
          npx --yes tsx alethech-ts/portable-verifier-test.ts /tmp/interop.aleth interop-passphrase > /tmp/browser-view.json
          python - <<'PY'
          import json
          v=json.load(open("/tmp/browser-view.json"))
          assert v["format"] == "alethech-memory-view"
          assert v["version"] == 1
          assert len(v["entries"]) == 1
          PY

      - name: Verify provider-neutral chat context contract
        run: |
          npx --yes tsx alethech-ts/context-adapter-test.ts /tmp/interop.aleth interop-passphrase > /tmp/chat-context.json
          python - <<'PY'
          import json
          c=json.load(open("/tmp/chat-context.json"))
          assert c["format"]=="alethech-context"
          assert c["version"]==1
          assert c["source_head"]
          assert len(c["items"])==1
          text=json.dumps(c)
          for forbidden in ("PRIVATE KEY","signing.key","root.key","recovery.key"):
              assert forbidden not in text
          PY

      - name: Verify provider bridge contract and stale-writeback guard
        run: |
          npx --yes tsx alethech-ts/chat-adapter-contract-test.ts /tmp/interop.aleth interop-passphrase > /tmp/chat-adapter.json
          python - <<'PY'
          import json
          a=json.load(open("/tmp/chat-adapter.json"))
          assert a["format"]=="alethech-chat-envelope"
          assert a["source_head"].startswith("sha256:")
          assert a["context_items"]==1
          assert a["writeback_items"]==1
          assert a["stale_rejected"] is True
          PY

      - name: Verify local-only provider writeback acceptance
        run: |
          npx --yes tsx alethech-ts/provider-writeback-test.ts /tmp/interop.aleth interop-passphrase > /tmp/provider-writeback.json
          python - <<'PY'
          import json
          w=json.load(open("/tmp/provider-writeback.json"))
          assert w["commits_added"]==2
          assert w["entries_after"]==w["entries_before"]+2
          assert w["after_head"]!=w["before_head"]
          assert w["stale_rejected"] is True
          PY

      - name: Verify offline provider bridge payloads
        run: |
          npx --yes tsx alethech-ts/provider-bridges-test.ts /tmp/interop.aleth interop-passphrase > /tmp/provider-bridges.json
          python - <<'PY'
          import json
          b=json.load(open("/tmp/provider-bridges.json"))
          assert b["source_head"].startswith("sha256:")
          assert b["openai_messages"]==2
          assert b["anthropic_messages"]==1
          assert b["local_context_items"]==1
          assert b["writeback_items"]==1
          assert b["freeform_rejected"] is True
          assert b["invalid_type_rejected"] is True
          PY

      - name: Verify V2 portable memory in browser TypeScript verifier
        run: |
          python scripts/make_v2_portable_fixture.py /tmp/aleth-v2 /tmp/v2.aleth
          npx --yes tsx alethech-ts/portable-verifier-test.ts /tmp/v2.aleth v2-passphrase > /tmp/browser-v2-view.json
          python - <<'PY'
          import json
          v=json.load(open("/tmp/browser-v2-view.json"))
          assert v["format"] == "alethech-memory-view"
          assert v["version"] == 1
          assert len(v["entries"]) == 1
          assert v["entries"][0]["content"]["interop"] == "v2-browser"
          PY

      - name: Verify migrated V2 portable continuity in browser
        run: |
          alethech --store /tmp/aleth-migrated init
          alethech --store /tmp/aleth-migrated migrate --to v0.2
          python - <<'PY'
          from alethech import Alethech
          a=Alethech.open("/tmp/aleth-migrated")
          ev=a.evidence(
              tool="migration.fixture",
              input_bytes=b"request",
              output_bytes=b"response",
              artifacts={"proof.bin":b"migration-proof"},
          )
          a.commit({"interop":"v2-migrated-browser"}, evidence_refs=[ev.commit_id])
          a.seal("/tmp/migrated-v2.aleth","migrated-passphrase")
          PY
          npx --yes tsx alethech-ts/portable-verifier-test.ts /tmp/migrated-v2.aleth migrated-passphrase > /tmp/browser-migrated-view.json
          python - <<'PY'
          import json
          v=json.load(open("/tmp/browser-migrated-view.json"))
          assert v["format"]=="alethech-memory-view"
          assert len(v["entries"])==1
          assert v["entries"][0]["content"]["interop"]=="v2-migrated-browser"
          PY

      - name: Append in TypeScript, reseal, and continue in Python
        run: |
          npx --yes tsx alethech-ts/portable-editor-test.ts /tmp/interop.aleth /tmp/browser-updated.aleth interop-passphrase > /tmp/editor-result.json
          python - <<'PY'
          import json
          from alethech import Alethech

          meta=json.load(open("/tmp/editor-result.json"))
          assert meta["entries_after"] == meta["entries_before"] + 1
          assert meta["new_head"] != meta["old_head"]

          restored=Alethech.open_aleth(
              "/tmp/browser-updated.aleth",
              "/tmp/from-browser-editor",
              "interop-passphrase",
          )
          report=restored.verify()
          assert report.ok, report.summary()
          commits=restored.store.load_commits()
          assert any(c.content.get("browser_continuation")=="works" for c in commits.values())

          # Device/runtime C can continue from the browser-produced file.
          next_commit=restored.commit({"continued_again":"python"})
          assert next_commit.parents == [meta["new_head"]]
          assert restored.verify().ok
          PY

      - name: Seal store in TypeScript and open in Python
        run: |
          npx --yes tsx alethech-ts/aleth-container.ts seal /tmp/aleth-source /tmp/ts-produced.aleth interop-passphrase
          python - <<'PY'
          from alethech import Alethech
          source = Alethech.open("/tmp/aleth-source")
          restored = Alethech.open_aleth("/tmp/ts-produced.aleth", "/tmp/from-ts", "interop-passphrase")
          assert restored.head == source.head
          assert restored.verify().ok
          assert not (restored.path / "keys" / "root.key").exists()
          assert not (restored.path / "keys" / "recovery.key").exists()
          assert (restored.path / "keys" / "signing.key").exists()
          PY


      - name: Seal store in Rust and open in Python
        run: |
          ./alethech-rs/target/release/alethech-container seal /tmp/aleth-source /tmp/rs-produced.aleth interop-passphrase
          python - <<'PY'
          from alethech import Alethech
          source = Alethech.open("/tmp/aleth-source")
          restored = Alethech.open_aleth("/tmp/rs-produced.aleth", "/tmp/from-rust", "interop-passphrase")
          assert restored.head == source.head
          assert restored.verify().ok
          assert not (restored.path / "keys" / "root.key").exists()
          assert not (restored.path / "keys" / "recovery.key").exists()
          assert (restored.path / "keys" / "signing.key").exists()
          PY


  browser-extension:
    name: browser extension package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked

      - name: Build extension
        run: bash scripts/build_extension.sh

      - name: Validate permissionless package
        run: |
          node - <<'JS'
          const fs=require("fs");
          const m=JSON.parse(fs.readFileSync("extension/dist/manifest.json","utf8"));
          if (m.manifest_version !== 3) throw new Error("Manifest V3 required");
          if ((m.permissions || []).length) throw new Error("Extension must not request permissions");
          if ((m.host_permissions || []).length) throw new Error("Extension must not request host permissions");
          if (!fs.existsSync("extension/dist/vendor/wasm/alethech_wasm_bg.wasm")) throw new Error("WASM missing");
          if (!fs.existsSync("extension/dist/popup.js")) throw new Error("popup bundle missing");
          JS

      - name: Smoke-check extension package contents
        run: |
          find extension/dist -maxdepth 3 -type f -print | sort
          test -s extension/dist/vendor/wasm/alethech_wasm_bg.wasm
