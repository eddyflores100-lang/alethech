name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Minimal permissions — only read access to repo content.
# Scorecard: Token-Permissions — explicit least-privilege.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    permissions:
      contents: read

    steps:
      # Pinned to commit SHA per Scorecard Pinned-Dependencies recommendation.
      # actions/checkout@v4.2.2 → 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # actions/setup-python@v5.4.0 → 42375524e23c412d93fb67b49958b491fce71c38
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: pip install -e ".[dev]"

      - name: Run pytest
        run: python -m pytest tests/ -v

      - name: Verify CLI works end-to-end
        run: |
          alethech --help
          alethech --store /tmp/alethech-ci-test init
          echo '{"test": true}' > /tmp/alethech-ci-content.json
          alethech --store /tmp/alethech-ci-test commit --content /tmp/alethech-ci-content.json
          alethech --store /tmp/alethech-ci-test verify


  cross-language:
    name: cross-language conformance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install Python package
        run: pip install -e .

      - name: Build Rust conformance helper
        run: cargo build --manifest-path alethech-rs/Cargo.toml --release --bin alethech-conf

      - name: Run all three implementations
        run: python conformance/cross_language_check.py
