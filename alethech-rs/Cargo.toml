[package]
name = "alethech"
version = "0.9.0"
edition = "2021"
description = "Verifiable agent continuity protocol — Ed25519-signed memory, hash-linked DAG, key rotation"
license = "MIT"
authors = ["AliceLabs"]
repository = "https://github.com/eddyflores100-lang/alethech"
keywords = ["cryptography", "ed25519", "agent", "memory", "verifiable"]
categories = ["cryptography", "authentication"]

[dependencies]
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64ct = { version = "1.6", features = ["alloc"] }
hex = "0.4"
thiserror = "1.0"
rand = "0.8"
aes-gcm = "0.10"
scrypt = "0.11"
hkdf = "0.12"

[dev-dependencies]
serde_json = "1.0"

[[bin]]
name = "alethech-conf"
path = "src/bin/conf.rs"


[[bin]]
name = "alethech-container"
path = "src/bin/aleth_container.rs"


[[bin]]
name = "alethech-container-v2"
path = "src/bin/aleth_container_v2.rs"
