[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alethech"
version = "0.4.4"
description = "Verifiable agent continuity protocol — local-first, zero-LLM, zero-blockchain"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AliceLabs" }]
dependencies = [
    "cryptography>=42.0",
    "click>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
alethech = "alethech.cli:cli"

[tool.setuptools.packages.find]
include = ["alethech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
