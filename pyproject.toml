[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alethech"
version = "0.8.5"
description = "Verifiable agent continuity protocol — local-first, zero-LLM, zero-blockchain"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AliceLabs" }]
keywords = ["cryptography", "ed25519", "agent-memory", "verifiable", "provenance", "hash-linked-dag", "key-rotation", "jcs", "rfc8785"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "cryptography>=42.0",
    "click>=8.0",
]

[project.urls]
Homepage = "https://alethech.alicelabs.site/"
Repository = "https://github.com/eddyflores100-lang/alethech"
Documentation = "https://github.com/eddyflores100-lang/alethech/blob/main/docs/implementacion-nucleo-minimo.md"
Changelog = "https://github.com/eddyflores100-lang/alethech/blob/main/CHANGELOG.md"
Issues = "https://github.com/eddyflores100-lang/alethech/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov",
]

[project.scripts]
alethech = "alethech.cli:cli"

[tool.setuptools.packages.find]
include = ["alethech*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
