[package]
name = "alethech-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser-local .aleth v1 authenticated decryptor"
license = "MIT"
repository = "https://github.com/eddyflores100-lang/alethech"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
aes-gcm = "0.10"
base64ct = { version = "1.8", features = ["alloc"] }
scrypt = { version = "0.11", default-features = false }
serde_json = "1.0"
wasm-bindgen = "=0.2.129"
getrandom = { version = "0.2", features = ["js"] }
